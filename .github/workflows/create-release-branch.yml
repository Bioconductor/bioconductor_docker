name: Create Release Branch

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Bioconductor version (e.g., 3.23) or "devel" to bump the devel branch'
        required: true
        default: 'devel'
      r_version:
        description: 'R version tag for base image (e.g., 4.4.2). Used for numbered releases; leave as "latest" for devel.'
        required: false
        default: 'latest'

jobs:
  create-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout devel branch
        uses: actions/checkout@v4
        with:
          ref: devel
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Create branch and update Dockerfile
        env:
          VERSION: ${{ github.event.inputs.version }}
          R_VERSION: ${{ github.event.inputs.r_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$VERSION" == "devel" ]; then
            # Read current BIOCONDUCTOR_VERSION and increment the minor version
            CURRENT_VER=$(grep -oP '(?<=^ARG BIOCONDUCTOR_VERSION=)[0-9.]+' Dockerfile | head -1)
            if [ -z "$CURRENT_VER" ]; then
              echo "ERROR: Could not find BIOCONDUCTOR_VERSION in Dockerfile" >&2
              exit 1
            fi
            MAJOR=$(echo "$CURRENT_VER" | cut -d. -f1)
            MINOR=$(echo "$CURRENT_VER" | cut -d. -f2)
            NEW_MINOR=$((MINOR + 1))
            NEW_VER="${MAJOR}.${NEW_MINOR}"

            BRANCH_NAME="bump-bioc-devel-${NEW_VER}"
            git checkout -b "$BRANCH_NAME"

            # Update both occurrences of BIOCONDUCTOR_VERSION in the Dockerfile
            sed -i "s/^ARG BIOCONDUCTOR_VERSION=.*/ARG BIOCONDUCTOR_VERSION=${NEW_VER}/" Dockerfile
            # Reset BIOCONDUCTOR_PATCH to 0
            sed -i "s/^ARG BIOCONDUCTOR_PATCH=.*/ARG BIOCONDUCTOR_PATCH=0/" Dockerfile

            PR_TITLE="Bump devel Bioconductor version to ${NEW_VER}"
            cat > /tmp/pr_body.md << EOF
          Automated bump of the devel \`BIOCONDUCTOR_VERSION\` from ${CURRENT_VER} to ${NEW_VER} and reset of \`BIOCONDUCTOR_PATCH\` to 0.
          EOF
          else
            # Derive release branch name from version (e.g., 3.23 -> RELEASE_3_23)
            BRANCH_NAME="RELEASE_$(echo "$VERSION" | tr '.' '_')"

            # Create the release branch from devel only if it does not already exist.
            git checkout devel
            if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null; then
              echo "Release branch ${BRANCH_NAME} already exists; skipping."
              exit 0
            fi
            git checkout -b "$BRANCH_NAME"

            if [ -z "$R_VERSION" ] || ! echo "$R_VERSION" | grep -qP '^\d+\.\d+\.\d+$'; then
              echo "ERROR: Invalid R version '${R_VERSION}'. Expected format like 4.6.0." >&2
              exit 1
            fi

            # Update amd64_tag and arm64_tag in Dockerfile
            sed -i "s/^ARG amd64_tag=.*/ARG amd64_tag=${R_VERSION}/" Dockerfile
            sed -i "s/^ARG arm64_tag=.*/ARG arm64_tag=${R_VERSION}/" Dockerfile

            # Update build matrix tags in build_containers workflow
            sed -i -E "/image: 'rocker\\/r-ver'/ s/amdtag: '[^']*'/amdtag: '${R_VERSION}'/" .github/workflows/build_containers.yaml
            sed -i -E "/image: 'rocker\\/rstudio'/ s/amdtag: '[^']*'/amdtag: '${R_VERSION}'/" .github/workflows/build_containers.yaml
            sed -i -E "/image: 'rocker\\/tidyverse'/ s/amdtag: '[^']*'/amdtag: '${R_VERSION}'/" .github/workflows/build_containers.yaml
            sed -i -E "/image: 'rocker\\/r-ver'/ s/armtag: '[^']*'/armtag: '${R_VERSION}'/" .github/workflows/build_containers.yaml
            sed -i -E "/image: 'rocker\\/rstudio'/ s/armtag: '[^']*'/armtag: '${R_VERSION}'/" .github/workflows/build_containers.yaml
            # Reset BIOCONDUCTOR_PATCH to 0
            sed -i "s/^ARG BIOCONDUCTOR_PATCH=.*/ARG BIOCONDUCTOR_PATCH=0/" Dockerfile

            PR_TITLE="Create ${BRANCH_NAME} for Bioconductor ${VERSION}"
          fi

          git add Dockerfile .github/workflows/build_containers.yaml
          git commit -m "$PR_TITLE"
          if [ "$VERSION" == "devel" ]; then
            git push --force-with-lease origin "$BRANCH_NAME"
          else
            git push origin "$BRANCH_NAME"
          fi

          if [ "$VERSION" == "devel" ]; then
            gh pr create \
              --title "$PR_TITLE" \
              --body-file /tmp/pr_body.md \
              --head "$BRANCH_NAME" \
              --base "devel" \
            || echo "PR already exists for branch ${BRANCH_NAME}, skipping creation."
          else
            echo "Release branch ${BRANCH_NAME} created and pushed; no PR will be opened."
          fi
